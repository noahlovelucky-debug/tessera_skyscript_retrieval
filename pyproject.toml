[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera-skyscript-retrieval"
version = "0.1.0"
description = "Frozen SkyCLIP alignment and text retrieval for TESSERA v1 Sentinel embeddings"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2",
  "pyarrow>=14",
  "pillow>=10",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "torch==2.12.1",
  "torchvision==0.27.1",
  "timm>=0.9",
  "transformers>=4.35",
  "ftfy>=6",
  "regex>=2023",
  "huggingface-hub>=0.20",
  "sentencepiece>=0.1.99",
  "protobuf<4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tessera-retrieval = "tessera_skyscript_retrieval.cli:main"

[tool.setuptools.packages.find]
include = ["tessera_skyscript_retrieval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["third_party"]
